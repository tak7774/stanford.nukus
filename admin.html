<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stanford Educational Centre — Staff Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- STEP 1: This line loads Supabase's toolkit so this page can talk to your project -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { font-family: system-ui, sans-serif; background:#111; color:#eee; max-width:640px; margin:40px auto; padding:0 16px; }
  input, textarea { width:100%; padding:10px; margin-bottom:10px; border-radius:6px; border:1px solid #333; background:#1a1a1a; color:#eee; box-sizing:border-box; }
  button { padding:10px 16px; border-radius:6px; border:none; background:#C9A227; color:#111; font-weight:600; cursor:pointer; }
  .card { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:10px; padding:20px; margin-bottom:16px; }
  .post { border-top:1px solid #2a2a2a; padding:12px 0; }
  .muted { color:#999; font-size:13px; }
  #logoutBtn { background:none; text-decoration:underline; color:#999; font-weight:400; padding:0; }
</style>
</head>
<body>

<h2>Stanford Educational Centre — Staff Admin</h2>
<div id="app"></div>

<script>
// STEP 2: Paste your own Project URL and anon public key here
// Find these in Supabase: Project Settings > API
const SUPABASE_URL = "https://nzbravxsxttloyicwcyq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56YnJhdnhzeHR0bG95aWN3Y3lxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTg3NzAsImV4cCI6MjEwMTgzNDc3MH0.YFZfZRWHTAvxTYRDcmokgpvmjT9iflpA4KGJMcnMrFY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

let session = null; // { email, role }

async function login(email, password) {
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    alert("Login failed: " + error.message);
    return;
  }
  // Look up this person's role in the staff_roles table
  const { data: roleRow, error: roleError } = await supabase
    .from('staff_roles')
    .select('role')
    .eq('email', email)
    .single();

  if (roleError || !roleRow) {
    alert("You logged in, but you're not listed in staff_roles. Ask the owner to add you.");
    await supabase.auth.signOut();
    return;
  }

  session = { email, role: roleRow.role };
  render();
}

async function logout() {
  await supabase.auth.signOut();
  session = null;
  render();
}

async function loadNews() {
  const { data, error } = await supabase
    .from('news')
    .select('*')
    .order('created_at', { ascending: false });
  return error ? [] : data;
}

async function addNews(title, body) {
  await supabase.from('news').insert([{ title, body }]);
  render();
}

async function deleteNews(id) {
  await supabase.from('news').delete().eq('id', id);
  render();
}

function loginScreen() {
  app.innerHTML = `
    <div class="card">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@stanfordnukus.uz" />
      <label>Password</label>
      <input id="password" type="password" />
      <button id="loginBtn">Log in</button>
    </div>
  `;
  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    login(email, password);
  });
}

async function dashboard() {
  const news = await loadNews();
  app.innerHTML = `
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <span>Logged in as <strong>${session.email}</strong> · role: ${session.role}</span>
      <button id="logoutBtn">Log out</button>
    </div>
    <div class="card">
      <label>Title</label>
      <input id="newTitle" placeholder="e.g. Autumn IELTS intake open" />
      <label>Details</label>
      <textarea id="newBody" rows="3"></textarea>
      <button id="addBtn">Publish</button>
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:10px;">Published news</div>
      ${news.map(n => `
        <div class="post">
          <strong>${n.title}</strong>
          <div class="muted">${new Date(n.created_at).toLocaleDateString()}</div>
          <div>${n.body}</div>
          ${session.role === 'owner' ? `<button data-id="${n.id}" class="delBtn" style="background:none; color:#999; font-weight:400; padding:0; margin-top:6px;">Remove</button>` : ''}
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('addBtn').addEventListener('click', () => {
    const title = document.getElementById('newTitle').value.trim();
    const body = document.getElementById('newBody').value.trim();
    if (title) addNews(title, body);
  });
  app.querySelectorAll('.delBtn').forEach(btn => {
    btn.addEventListener('click', () => deleteNews(Number(btn.dataset.id)));
  });
}

function render() {
  session ? dashboard() : loginScreen();
}

render();
</script>
</body>
</html>
