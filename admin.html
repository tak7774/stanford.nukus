<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<title>Stanford — панель администратора</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F7;--bg2:#FFFFFF;--bg3:#F0F0F2;--bg4:#E2E3E7;
  --border:#E7E7EA;--border2:#D5D6DB;
  --text:#141416;--text2:#4A4C55;--text3:#868893;
  --gold:#FFB703;--gold-hover:#F0A800;--gold-soft:#FFF4D6;--gold-border:#FFD970;
  --warn:#B54708;--warn-soft:#FEF0E6;
  --green:#18794E;--green-soft:#E6F4EC;
  --blue:#2F5BD3;--blue-soft:#EAF0FD;
  --purple:#6E44C9;--purple-soft:#F1ECFB;
  --ink:#141416;
  --sidebar-w:248px;
  --radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ── LOGIN ── */
#loginWrap{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--gold);padding:16px}
.login-card{background:var(--bg2);border-radius:24px;padding:44px 36px;width:100%;max-width:400px;text-align:center}
.login-card .logo{height:44px;margin:0 auto 10px;display:block}
.login-card .subtitle{color:var(--text3);font-size:.85rem;margin-bottom:28px}
.login-card label{display:block;text-align:left;font-size:.8rem;font-weight:600;color:var(--text2);margin-bottom:6px}
.login-card input{width:100%;height:46px;padding:0 16px;background:var(--bg3);border:1.5px solid transparent;border-radius:12px;color:var(--text);font-size:.92rem;margin-bottom:16px;outline:none;transition:border-color .2s,background .2s}
.login-card input:focus{border-color:var(--ink);background:#fff}
.login-card .btn-login{width:100%;height:48px;background:var(--ink);color:#fff;font-weight:700;font-size:.92rem;border:none;border-radius:999px;transition:background .2s}
.login-card .btn-login:hover{background:#2A2B30}
.login-error{color:var(--warn);font-size:.84rem;margin-bottom:12px;display:none}

/* ── LAYOUT ── */
.app-layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s}
.sidebar-logo{padding:22px 22px 18px;border-bottom:1px solid var(--border)}
.sidebar-logo img{height:34px;display:block}
.sidebar-logo small{display:block;font-size:.72rem;color:var(--text3);font-weight:500;margin-top:8px}
.sidebar-nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;font-size:.9rem;font-weight:500;color:var(--text2);transition:background .15s,color .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--gold);color:var(--ink);font-weight:600}
.nav-item .icon{width:20px;text-align:center;font-size:1rem}
.sidebar-footer{padding:16px;border-top:1px solid var(--border)}
.user-info{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg3)}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--ink);flex-shrink:0}
.user-email{font-size:.78rem;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.user-role{font-size:.7rem;color:var(--text3);font-weight:600}
.btn-logout{width:100%;margin-top:10px;padding:9px;background:none;border:1px solid var(--border);border-radius:999px;color:var(--text2);font-size:.8rem;font-weight:500;transition:border-color .2s}
.btn-logout:hover{border-color:var(--ink);color:var(--ink)}

.main-content{flex:1;overflow-y:auto;padding:32px 36px;background:var(--bg)}
.page-header{margin-bottom:28px}
.page-header h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.page-header p{color:var(--text3);font-size:.9rem;max-width:640px;line-height:1.5}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.stat-card .stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;margin-bottom:14px}
.stat-card .stat-num{font-size:1.8rem;font-weight:800;letter-spacing:-.02em}
.stat-card .stat-label{font-size:.8rem;color:var(--text3);margin-top:2px}
.stat-icon.gold{background:var(--gold-soft)}
.stat-icon.blue{background:var(--blue-soft)}
.stat-icon.green{background:var(--green-soft)}
.stat-icon.purple{background:var(--purple-soft)}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:18px}
.card-title{font-size:1.05rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.75rem;font-weight:600;color:var(--text3);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--border);font-size:.88rem;color:var(--text2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAFB}

.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge-gold{background:var(--gold-soft);color:#8A5A00}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-blue{background:var(--blue-soft);color:var(--blue)}
.badge-purple{background:var(--purple-soft);color:var(--purple)}
.badge-gray{background:var(--bg3);color:var(--text2)}

.btn{height:38px;padding:0 16px;border-radius:999px;font-size:.84rem;font-weight:600;border:none;transition:background .15s,border-color .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--gold);color:var(--ink)}
.btn-primary:hover{background:var(--gold-hover)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#2A2B30}
.btn-secondary{background:var(--bg2);color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{border-color:var(--ink)}
.btn-secondary:disabled{opacity:.4;cursor:not-allowed}
.btn-danger{background:var(--bg2);color:var(--warn);border:1px solid #F2C9AE}
.btn-danger:hover{background:var(--warn-soft)}
.btn-sm{height:32px;padding:0 12px;font-size:.78rem}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--text2);margin-bottom:6px}
.form-control{width:100%;height:42px;padding:0 14px;background:var(--bg2);border:1.5px solid var(--border2);border-radius:10px;color:var(--text);font-size:.9rem;outline:none;transition:border-color .15s}
.form-control:focus{border-color:var(--ink)}
textarea.form-control{resize:vertical;min-height:80px;height:auto;padding:10px 14px;line-height:1.5}
select.form-control{cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hint{font-size:.78rem;color:var(--text3);margin-top:6px;line-height:1.45}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem;font-weight:500;color:var(--text)}
.switch input{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--bg4);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{transform:translateX(18px)}

.modal-overlay{position:fixed;inset:0;background:rgba(20,20,22,.45);display:flex;align-items:center;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:opacity .2s;padding:16px}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:var(--bg2);border-radius:20px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:28px}
.modal.wide{max-width:1100px}
.modal-title{font-size:1.2rem;font-weight:800;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-close{background:var(--bg3);border:none;color:var(--text2);font-size:1rem;cursor:pointer;width:36px;height:36px;border-radius:50%;flex-shrink:0}
.modal-close:hover{background:var(--gold)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

.empty-state{text-align:center;padding:52px 20px;color:var(--text3)}
.empty-state .icon{font-size:2.2rem;margin-bottom:12px}
.empty-state h3{color:var(--text);font-size:1.05rem;margin-bottom:6px}
.empty-state p{font-size:.88rem;margin-bottom:18px}

.activity-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.activity-text{font-size:.86rem;color:var(--text2);line-height:1.5}
.activity-text strong{color:var(--text)}
.activity-time{font-size:.75rem;color:var(--text3);margin-top:2px}

.filter-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.filter-bar select{height:38px;padding:0 12px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-size:.84rem;outline:none}
.gallery-admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gallery-admin-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.gallery-admin-card img{width:100%;height:160px;object-fit:cover;display:block;background:var(--bg3)}
.gallery-admin-body{padding:12px;display:flex;flex-direction:column;gap:8px}
.gallery-admin-body .form-control{height:36px;font-size:.82rem}
.gallery-admin-actions{display:flex;gap:6px;flex-wrap:wrap}
.gallery-pos{font-size:.75rem;color:var(--text3)}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:26px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;color:var(--text2);font-size:.9rem;line-height:1.6}
.upload-zone:hover,.upload-zone.drag{border-color:var(--ink);background:var(--gold-soft)}

/* Results & teachers */
.thumb{width:44px;height:60px;border-radius:8px;object-fit:cover;background:linear-gradient(160deg,#FFD15C,#FFB703);display:block}
.thumb.round{width:44px;height:44px;border-radius:50%}
.overall-pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:30px;padding:0 10px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.bands{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.82rem}
.order-btns{display:inline-flex;gap:4px}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-preview{width:90px;height:160px;border-radius:12px;object-fit:cover;background:linear-gradient(160deg,#FFD15C,#FFB703);flex-shrink:0;display:block}
.photo-preview.square{height:90px;border-radius:50%}
.overall-preview{display:flex;align-items:center;gap:12px;background:var(--bg3);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.overall-preview strong{font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.overall-preview span{font-size:.82rem;color:var(--text3)}
.score-input{width:64px;height:34px;padding:0 6px;text-align:center;border:1.5px solid var(--border2);border-radius:8px;font-size:.86rem;font-variant-numeric:tabular-nums}
.score-input:focus{border-color:var(--ink);outline:none}
.score-input.bad{border-color:var(--warn);background:var(--warn-soft)}
.note-input{width:100%;min-width:180px;min-height:38px;padding:8px 10px;border:1.5px solid var(--border2);border-radius:8px;font-size:.82rem;resize:vertical;line-height:1.4}
.note-input:focus{border-color:var(--ink);outline:none}
.muted{color:var(--text3)}
.comment-cell{max-width:240px;font-size:.82rem;line-height:1.45;white-space:pre-wrap;word-break:break-word}

.hamburger-admin{display:none;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:1.3rem;position:fixed;top:12px;left:12px;z-index:600;width:44px;height:44px;border-radius:12px}

.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);border-radius:12px;padding:14px 20px;color:#fff;font-size:.88rem;font-weight:500;z-index:700;transform:translateY(100px);opacity:0;transition:transform .3s,opacity .3s;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 48px)}
.toast.active{transform:translateY(0);opacity:1}
.toast.error{background:var(--warn)}

@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;height:100%;z-index:500;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.15)}
  .hamburger-admin{display:block}
  .main-content{padding:24px 16px;padding-top:68px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .form-row{grid-template-columns:1fr}
  .form-row-4{grid-template-columns:repeat(2,1fr)}
  .page-header-row{flex-direction:column;align-items:flex-start !important;gap:12px}
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .modal{padding:22px 18px}
}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginWrap">
  <div class="login-card">
    <img class="logo" src="images/logo-row-black.png" alt="Stanford language center"/>
    <div class="subtitle">Панель администратора</div>
    <div class="login-error" id="loginError"></div>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username" placeholder="you@stanfordnukus.uz"/>
    <label for="loginPassword">Пароль</label>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••"/>
    <button class="btn-login" id="loginBtn">Войти</button>
  </div>
</div>

<!-- App Shell (hidden until login) -->
<div class="app-layout" id="appLayout" style="display:none">
  <button class="hamburger-admin" id="hamburgerAdmin" aria-label="Меню">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><img src="images/logo-row-black.png" alt="Stanford language center"/><small>Панель администратора</small></div>
    <nav class="sidebar-nav" id="sidebarNav">
      <button class="nav-item active" data-page="dashboard"><span class="icon">📊</span> Обзор</button>
      <button class="nav-item" data-page="exams"><span class="icon">📝</span> Mock Exams</button>
      <button class="nav-item" data-page="students"><span class="icon">👥</span> Заявки</button>
      <button class="nav-item" data-page="results"><span class="icon">🏆</span> Результаты</button>
      <button class="nav-item" data-page="teachers"><span class="icon">🎓</span> Преподаватели</button>
      <button class="nav-item" data-page="gallery"><span class="icon">🖼️</span> Галерея</button>
      <button class="nav-item" data-page="news"><span class="icon">📰</span> Новости</button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">A</div>
        <div>
          <div class="user-email" id="userEmail">admin@stanford.uz</div>
          <div class="user-role" id="userRole">owner</div>
        </div>
      </div>
      <button class="btn-logout" id="logoutBtn">Выйти</button>
    </div>
  </aside>

  <main class="main-content" id="mainContent"></main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="status"></div>

<script src="admin.js"></script>
</body>
</html>
