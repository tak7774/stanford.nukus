<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light"/>
<script src="theme.js"></script>
<title>Кабинет студента и преподавателя | Stanford Language Center</title>
<meta name="description" content="Кабинет Stanford Language Center: курсы, задания и книги для студентов и преподавателей."/>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#FFB703"/>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141416; --ink-2:#2A2B30; --text:#141416; --nav-bg:rgba(255,255,255,.92); --paper:#FFFFFF; --mist:#F4F5F6; --line:#E6E8EC; --muted:#5F6577;
    --yellow:#FFB703; --yellow-deep:#EBA600; --yellow-soft:#FFF4D6; --on-soft:#5B3F00; --ok-bg:#DDF3E4; --ok:#0F5132;
    --r-lg:28px; --r-md:22px; --r-sm:12px; --pill:999px; --gutter:24px; --nav-h:56px; --nav-top:12px;
    --shadow:0 8px 28px rgba(20,20,22,.07);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  :root[data-theme="dark"]{
    --ink:#26272C; --ink-2:#33343A; --text:#F2F2F3; --paper:#0E0E10; --mist:#17171A; --line:#2A2B30; --muted:#9AA0AE;
    --yellow-soft:#3A2F10; --on-soft:#FFD479; --ok-bg:#12301F; --ok:#8FD9A8; --nav-bg:rgba(24,24,27,.9); --shadow:0 8px 28px rgba(0,0,0,.45);
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{ font-family:'Inter',system-ui,sans-serif; background:var(--mist); color:var(--text); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  img{ display:block; max-width:100%; }
  a{ color:inherit; }
  button,input,select,textarea{ font:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2.5px solid var(--text); outline-offset:3px; border-radius:6px; }
  [hidden]{ display:none !important; }
  .icon{ width:18px; height:18px; flex-shrink:0; }
  .wrap{ max-width:calc(1140px + var(--gutter) * 2); margin:0 auto; padding:0 var(--gutter); }
  h1,h2,h3{ font-weight:800; letter-spacing:-0.02em; line-height:1.15; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 22px; border-radius:var(--pill); border:1.5px solid transparent; font-weight:700; font-size:14px; text-decoration:none; white-space:nowrap; transition:background-color .2s, color .2s, transform .2s var(--ease); }
  .btn:active{ transform:scale(.98); }
  .btn-ink{ background:var(--ink); color:#fff; }
  .btn-ink:hover{ background:var(--ink-2); }
  .btn-yellow{ background:var(--yellow); color:#141416; }
  .btn-yellow:hover{ background:var(--yellow-deep); }
  .btn-ghost{ background:none; border-color:var(--muted); }
  .btn-ghost:hover{ border-color:var(--text); }
  .btn-sm{ height:38px; padding:0 18px; }
  .btn-lg{ height:52px; font-size:16px; }

  .for-dark{ display:none; }
  :root[data-theme="dark"] .for-light{ display:none; }
  :root[data-theme="dark"] .for-dark{ display:block; }
  :root[data-theme="dark"] .btn-ink{ background:#F2F2F3; color:#141416; }
  :root[data-theme="dark"] .btn-ink:hover{ background:#fff; }
  :root[data-theme="dark"] .lang-switch button:hover{ background:#26272C; }
  :root[data-theme="dark"] .lang-switch button.active{ background:var(--yellow); color:#141416; }
  .theme-toggle{ width:36px; height:36px; border:none; border-radius:50%; background:var(--mist); display:flex; align-items:center; justify-content:center; transition:background-color .2s; }
  .theme-toggle:hover{ background:var(--yellow); color:#141416; }
  .theme-toggle .i-sun{ display:none; }
  :root[data-theme="dark"] .theme-toggle .i-sun{ display:block; }
  :root[data-theme="dark"] .theme-toggle .i-moon{ display:none; }

  header{ position:sticky; top:var(--nav-top); z-index:100; margin-top:var(--nav-top); }
  .nav-inner{ height:var(--nav-h); display:flex; align-items:center; gap:16px; padding:0 8px 0 20px; background:var(--nav-bg); backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px); border-radius:var(--pill); box-shadow:var(--shadow); }
  .logo img{ height:28px; width:auto; }
  .nav-right{ margin-left:auto; display:flex; align-items:center; gap:8px; }
  .nav-home{ font-weight:600; font-size:13.5px; text-decoration:none; padding:7px 12px; border-radius:var(--pill); transition:background-color .2s; }
  .nav-home:hover{ background:var(--mist); }
  .lang-switch{ display:inline-flex; padding:3px; gap:2px; border-radius:var(--pill); background:var(--mist); }
  .lang-switch button{ width:32px; height:28px; border:none; background:none; border-radius:var(--pill); font-weight:700; font-size:11px; transition:background-color .2s; }
  .lang-switch button:hover{ background:#E9EAED; }
  .lang-switch button.active{ background:var(--ink); color:#fff; }

  main.wrap{ padding-top:28px; padding-bottom:72px; }
  .demo-note{ background:var(--yellow-soft); color:var(--on-soft); border-radius:var(--r-sm); padding:10px 16px; font-size:14px; margin-bottom:24px; }

  /* Card + shared bits */
  .card{ background:var(--paper); border-radius:var(--r-md); padding:22px; box-shadow:var(--shadow); }
  .card.list{ padding:6px 22px; }
  .muted{ color:var(--muted); }
  .small{ font-size:14px; }
  .stack{ display:flex; flex-direction:column; }
  .gap-2{ gap:8px; } .gap-3{ gap:14px; } .gap-4{ gap:20px; } .gap-5{ gap:32px; }
  .row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:14px 0; border-top:1px solid var(--line); }
  .row:first-child{ border-top:0; }
  .row .grow{ flex:1 1 240px; min-width:0; }
  h1.page{ font-size:34px; }
  h2.sec{ font-size:20px; }
  .chip{ padding:4px 12px; border-radius:var(--pill); font-size:13px; font-weight:600; white-space:nowrap; }
  .chip.soon{ background:var(--yellow-soft); color:var(--on-soft); }
  .chip.wait{ background:var(--line); color:var(--text); }
  .chip.done{ background:var(--ok-bg); color:var(--ok); }

  /* Portal bar */
  .pbar{ background:var(--paper); border-radius:var(--pill); box-shadow:var(--shadow); padding:8px 8px 8px 12px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; margin-bottom:28px; }
  .pbar nav{ display:flex; flex-wrap:wrap; gap:4px; flex-grow:1; }
  .pbar nav a{ padding:8px 16px; border-radius:var(--pill); text-decoration:none; font-weight:500; }
  .pbar nav a:hover{ background:var(--mist); }
  .pbar nav a[aria-current="page"]{ background:var(--ink); color:#fff; font-weight:600; }
  :root[data-theme="dark"] .pbar nav a[aria-current="page"]{ background:#F2F2F3; color:#141416; }
  .who{ display:flex; align-items:center; gap:10px; font-weight:600; padding-right:8px; }
  .avatar{ width:36px; height:36px; border-radius:50%; background:var(--yellow-soft); color:var(--on-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
  .avatar.dark{ background:#141416; color:var(--yellow); }

  .cols{ display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start; }
  .cols > .main{ flex:999 1 560px; min-width:0; }
  .cols > aside{ flex:1 1 300px; min-width:0; }
  .grid{ display:flex; flex-wrap:wrap; gap:16px; }
  .grid > .card{ flex:1 1 260px; }
  .bar{ height:8px; border-radius:var(--pill); background:var(--line); overflow:hidden; }
  .bar > i{ display:block; height:100%; background:var(--yellow); }

  .cover{ width:92px; height:132px; flex-shrink:0; padding:10px; border-radius:8px 14px 14px 8px; font-weight:700; font-size:13px; line-height:1.25; text-decoration:none; display:flex; align-items:flex-end; }
  .cover.c1{ background:#141416; color:#FFB703; }
  .cover.c2{ background:#FFB703; color:#141416; }
  .cover.c3{ background:#5F6577; color:#fff; }
  .cover.c4{ background:#FFF4D6; color:#5B3F00; }
  .books{ display:flex; flex-wrap:wrap; gap:14px; }

  /* Forms */
  label{ font-weight:600; }
  input[type=text],input[type=tel],input[type=email],input[type=password],input[type=date],input[type=search],input[type=url],select,textarea{ width:100%; height:48px; border:1px solid var(--muted); border-radius:var(--r-sm); padding:0 14px; background:var(--paper); }
  textarea{ height:auto; padding:12px 14px; resize:vertical; }
  input[type=search]{ border-radius:var(--pill); padding:0 20px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .seg{ display:flex; gap:10px; }
  .seg button{ flex:1; height:52px; border-radius:14px; font-weight:700; border:2px solid var(--muted); background:var(--paper); }
  .seg button[aria-pressed="true"]{ background:var(--ink); color:#fff; border-color:var(--ink); }
  :root[data-theme="dark"] .seg button[aria-pressed="true"]{ background:var(--yellow); color:#141416; border-color:var(--yellow); }
  .notice{ background:var(--yellow-soft); color:var(--on-soft); border-radius:var(--r-sm); padding:12px 14px; }
  .filters{ display:flex; flex-wrap:wrap; gap:8px; }
  .chips button{ height:40px; padding:0 18px; border-radius:var(--pill); border:2px solid var(--muted); background:var(--paper); font-weight:600; }
  .chips button[aria-pressed="true"]{ background:var(--ink); color:#fff; border-color:var(--ink); }
  :root[data-theme="dark"] .chips button[aria-pressed="true"]{ background:var(--yellow); color:#141416; border-color:var(--yellow); }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* Sign-up screen */
  .signup{ display:flex; flex-wrap:wrap; border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow); background:var(--paper); }
  .signup .side{ flex:1 1 380px; background:#141416; color:#F2F2F3; padding:44px; display:flex; flex-direction:column; justify-content:space-between; gap:40px; }
  .signup .side h1{ font-size:40px; letter-spacing:-0.02em; max-width:440px; }
  .signup .side ul{ list-style:none; display:flex; flex-direction:column; gap:14px; color:#C9CCD4; font-size:16px; }
  .signup .side li{ display:flex; gap:12px; align-items:baseline; }
  .signup .side li::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--yellow); flex-shrink:0; }
  .signup .side a{ color:var(--yellow); font-weight:600; }
  .signup form{ flex:999 1 440px; padding:44px 28px; display:flex; flex-direction:column; justify-content:center; gap:18px; max-width:520px; width:100%; margin:0 auto; }

  /* Screens */
  .screen{ display:none; }
  .screen.on{ display:block; }

  @media (max-width:640px){
    :root{ --gutter:14px; --nav-h:52px; --nav-top:8px; }
    body{ font-size:14.5px; }
    .nav-inner{ padding:0 6px 0 14px; gap:8px; }
    .logo img{ height:24px; }
    .nav-home{ display:none; }
    .lang-switch button{ width:28px; height:26px; font-size:10.5px; }
    h1.page{ font-size:28px; }
    .signup .side{ padding:28px; }
    .signup .side h1{ font-size:30px; }
    .signup form{ padding:28px 18px; }
    .pbar{ border-radius:var(--r-md); }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }

  /* ── Dynamic portal pieces ── */
  .err{ color:#B42318; font-size:14px; font-weight:500; }
  :root[data-theme="dark"] .err{ color:#FF8A80; }
  .err:empty{ display:none; }
  .empty{ padding:14px 0; }
  .chip.late{ background:#FEE4E2; color:#912018; }
  :root[data-theme="dark"] .chip.late{ background:#3B1613; color:#FF9E94; }
  .row.wrap-row .panel{ flex-basis:100%; }
  .panel{ display:flex; flex-direction:column; gap:12px; padding:14px 0 4px; }
  .panel textarea{ width:100%; }
  .pre{ white-space:pre-wrap; overflow-wrap:anywhere; }
  .answer{ background:var(--mist); border-radius:var(--r-sm); padding:12px 14px; }
  .row.nowrap{ flex-wrap:nowrap; }
  .row .day{ width:96px; flex-shrink:0; font-weight:600; text-transform:capitalize; }
  .between{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center; }
  ul.plain{ list-style:none; display:flex; flex-direction:column; gap:6px; }
  .card.book{ display:flex; gap:16px; }
  .btn:disabled{ opacity:.55; cursor:not-allowed; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:12px 20px; border-radius:var(--pill); font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s var(--ease); z-index:200; max-width:calc(100vw - 28px); }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
  .toast.bad{ background:#B42318; }
  :root[data-theme="dark"] .toast{ background:#F2F2F3; color:#141416; }
  :root[data-theme="dark"] .toast.bad{ background:#FF8A80; color:#141416; }
  .signup form{ align-self:center; }
</style>
</head>
<body data-title-key="portal-page-title">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-moon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></symbol>
</svg>

<header>
  <div class="wrap nav-inner">
    <a href="index.html" class="logo" aria-label="Stanford language center"><img class="for-light" src="images/logo-row-black.png" alt="" width="167" height="36"/><img class="for-dark" src="images/logo-row-white.png" alt="" width="167" height="36"/></a>
    <div class="nav-right">
      <a href="index.html" class="nav-home" data-i18n="nav-home">На главную</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" data-i18n-aria="theme-toggle" aria-label="Тёмная тема"><svg class="icon i-moon"><use href="#i-moon"/></svg><svg class="icon i-sun"><use href="#i-sun"/></svg></button>
      <div class="lang-switch" role="group" data-i18n-aria="lang-label" aria-label="Язык сайта">
        <button type="button" data-lang="ru" lang="ru">RU</button>
        <button type="button" data-lang="kaa" lang="kaa" title="Qaraqalpaqsha">QQ</button>
        <button type="button" data-lang="en" lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="app" aria-live="polite"><p class="muted">Загрузка…</p></div>
  <noscript><p class="demo-note">Для работы кабинета нужен JavaScript. Включите его в настройках браузера.</p></noscript>
</main>

<script src="translations.js"></script>
<script src="i18n.js"></script>
<script src="portal.js"></script>
</body>
</html>
