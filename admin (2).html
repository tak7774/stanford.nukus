<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stanford Educational Centre — Staff Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Loads Supabase's toolkit so this page can talk to your project -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { font-family: system-ui, sans-serif; background:#111; color:#eee; max-width:640px; margin:40px auto; padding:0 16px; }
  input, textarea { width:100%; padding:10px; margin-bottom:10px; border-radius:6px; border:1px solid #333; background:#1a1a1a; color:#eee; box-sizing:border-box; }
  button { padding:10px 16px; border-radius:6px; border:none; background:#C9A227; color:#111; font-weight:600; cursor:pointer; }
  .card { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:10px; padding:20px; margin-bottom:16px; }
  .post { border-top:1px solid #2a2a2a; padding:12px 0; }
  .muted { color:#999; font-size:13px; }
  #logoutBtn { background:none; text-decoration:underline; color:#999; font-weight:400; padding:0; }
</style>
</head>
<body>

<h2>Stanford Educational Centre — Staff Admin</h2>
<div id="app"></div>

<!-- IMPORTANT: this script must load AFTER the supabase-js CDN script above,
     and admin.js must be next to this file, not in a subfolder -->
<script src="admin.js"></script>
</body>
</html>
