<h2 class="sr-only">Demo of an admin panel editing Stanford Educational Centre's homepage, with a live preview and the underlying data file updating in real time</h2>
<div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
  <div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:1rem 1.25rem;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
      <i class="ti ti-lock" style="font-size:16px; color:var(--text-secondary);" aria-hidden="true"></i>
      <span style="font-size:13px; color:var(--text-secondary);">Admin panel (staff only)</span>
    </div>
    <label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:4px;">Announcement banner</label>
    <input id="banner" value="Autumn IELTS intake now open" style="width:100%; margin-bottom:14px;" />
    <div id="courseRows"></div>
    <div style="font-size:12px; color:var(--text-muted); margin-top:8px;">Editing updates the site instantly, no redeploy.</div>
  </div>
  <div>
    <div style="background:var(--surface-1); border-radius:12px; padding:1rem 1.25rem; margin-bottom:12px;">
      <div style="font-size:11px; color:var(--text-secondary); margin-bottom:6px;">Public site preview</div>
      <div id="pvBanner" style="background:var(--bg-accent); color:var(--text-accent); font-size:13px; padding:8px 12px; border-radius:var(--radius); margin-bottom:12px;"></div>
      <div id="pvCourses"></div>
    </div>
    <div style="background:var(--surface-1); border-radius:12px; padding:1rem 1.25rem;">
      <div style="font-size:11px; color:var(--text-secondary); margin-bottom:6px;">courses.json (the data file both sides read/write)</div>
      <pre id="jsonView" style="font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); margin:0; white-space:pre-wrap; line-height:1.5;"></pre>
    </div>
  </div>
</div>
<script>
let courses = [
  {name:"IELTS Preparation", price:"450,000 UZS/mo", schedule:"Mon/Wed/Fri 17:00"},
  {name:"General English", price:"350,000 UZS/mo", schedule:"Tue/Thu 18:00"}
];
const rows = document.getElementById('courseRows');
const pvCourses = document.getElementById('pvCourses');
const pvBanner = document.getElementById('pvBanner');
const jsonView = document.getElementById('jsonView');
const banner = document.getElementById('banner');

function render(){
  rows.innerHTML = courses.map((c,i)=>`
    <div style="border-top:0.5px solid var(--border); padding:10px 0;">
      <input data-i="${i}" data-k="name" value="${c.name}" style="width:100%; margin-bottom:6px;" />
      <div style="display:flex; gap:6px;">
        <input data-i="${i}" data-k="price" value="${c.price}" style="flex:1;" />
        <input data-i="${i}" data-k="schedule" value="${c.schedule}" style="flex:1;" />
      </div>
    </div>
  `).join('');
  pvCourses.innerHTML = courses.map(c=>`
    <div style="border:0.5px solid var(--border); border-radius:var(--radius); padding:10px 12px; margin-bottom:8px;">
      <div style="font-weight:500; font-size:14px;">${c.name}</div>
      <div style="font-size:12px; color:var(--text-secondary);">${c.schedule} · ${c.price}</div>
    </div>
  `).join('');
  pvBanner.textContent = banner.value;
  jsonView.textContent = JSON.stringify({banner: banner.value, courses}, null, 2);
}

rows.addEventListener('input', e=>{
  const i = e.target.dataset.i, k = e.target.dataset.k;
  if(i===undefined) return;
  courses[i][k] = e.target.value;
  render();
});
banner.addEventListener('input', render);
render();
</script>
